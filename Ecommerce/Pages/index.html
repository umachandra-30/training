<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyMart</title>

    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRZAMBoHaDaQ7HuD4TOGMVUtAJVaKCncKJk0szdGZPaUg&s=10">
    <!--<link rel="stylesheet" href="../Styles/index.css">-->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <header>
      <nav class="bg-white fixed w-full z-20 top-0 start-0 border-b border-gray-200 shadow-sm">
    <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">

        <!-- MyMart Logo -->
        <a href="index.html" class="flex items-center space-x-3">
            <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRn-v-lbsJ6d16GYC-b-LrtQIbIGDRGZQntPGCNRy-jkQ&s=10"
                class="h-10 w-auto"
                alt="MyMart Logo"
            />
            <span class="self-center text-2xl font-bold text-blue-700 whitespace-nowrap">
                MyMart
            </span>
        </a>

        <!-- Mobile Menu Button -->
        <button
            data-collapse-toggle="navbar-mymart"
            type="button"
            class="inline-flex items-center p-2 w-10 h-10 justify-center text-gray-600 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200"
            aria-controls="navbar-mymart"
            aria-expanded="false"
            aria-label="Open main menu"
        >
            <svg class="w-6 h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M5 7h14M5 12h14M5 17h14"/>
            </svg>
        </button>

        <!-- Navigation Links -->
        <div class="hidden w-full md:flex md:w-auto md:items-center" id="navbar-mymart">
            <ul class="flex flex-col md:flex-row md:space-x-8 font-medium p-4 md:p-0 mt-4 md:mt-0 border border-gray-100 md:border-0 rounded-lg bg-gray-50 md:bg-white">
                <li>
                    <a href="index.html" class="block py-2 px-3 text-blue-700 md:p-0" aria-current="page">
                        Home
                    </a>
                </li>

                <li>
                    <a href="Products.html" class="block py-2 px-3 text-gray-700 rounded hover:text-blue-700 md:p-0">
                        Products
                    </a>
                </li>

                <li>
                    <a href="Cart.html" class="block py-2 px-3 text-gray-700 rounded hover:text-blue-700 md:p-0">
                        Cart
                    </a>
                </li>

                <li>
                    <a href="Contact.html" class="block py-2 px-3 text-gray-700 rounded hover:text-blue-700 md:p-0">
                        Contact
                    </a>
                </li>

                <li>
                    <a href="Logout.html" class="block py-2 px-3 text-red-600 rounded hover:text-red-700 md:p-0">
                        Logout
                    </a>
                </li>

            </ul>
        </div>

    </div>
</nav>
    </header>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.2/flowbite.min.js"></script>
</body>
</html>
